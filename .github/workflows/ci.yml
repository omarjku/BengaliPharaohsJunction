name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: craci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt pytest
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q tests

  packages-tests:
    runs-on: craci
    strategy:
      fail-fast: false
      matrix:
        package:
          - contracts
          - decision
          - compiler
          - profile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ${{ matrix.package }}/pyproject.toml
      - name: Install shared contracts package
        if: matrix.package != 'contracts'
        run: pip install -e contracts
      - name: Install package dependencies
        run: pip install -e "${{ matrix.package }}[dev]" pytest
      - name: Run package tests
        run: python -m pytest -q ${{ matrix.package }}/tests

  frontend:
    runs-on: craci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  provenance:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'pull_request'
    runs-on: craci
    needs:
      - backend-tests
      - packages-tests
      - frontend
    steps:
      # CRACI's API answers 403 to calls from inside CRACI runners, so the CRACI evidence (SBOM, network trace) is
      # fetched by the deployed app (backend/app/craci_evidence.py, /.well-known/front-door-build.json). This job only
      # records the commit and run; it gets no CRACI token.
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Collect CRACI SBOM and network evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/craci_sbom.py
      - name: Write build provenance
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          summary = json.loads(Path("craci-sbom-summary.json").read_text(encoding="utf-8"))
          provenance = {
              "commit": os.environ["GITHUB_SHA"],
              "ci_run": os.environ["GITHUB_RUN_ID"],
              "craci_build_id": summary.get("craci_build_id") or f"github:{os.environ['GITHUB_REPOSITORY']}:{os.environ['GITHUB_RUN_ID']}",
              "sbom_sha256": summary.get("sbom_sha256"),
              "generated_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
          }
          Path("build-provenance.json").write_text(json.dumps(provenance, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Show CRACI evidence in the log
        run: |
          echo '--- build-provenance.json'; cat build-provenance.json
          echo '--- craci-sbom-summary.json (first 4000 chars)'; head -c 4000 craci-sbom-summary.json; echo
      - name: Upload CRACI provenance
        continue-on-error: true  # GitHub artifact storage quota is full on this account; the log above has the evidence
        uses: actions/upload-artifact@v4
        with:
          name: craci-provenance
          path: |
            build-provenance.json
            craci-sbom-summary.json
