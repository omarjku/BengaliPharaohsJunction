[project]
name = "trade-contracts"
version = "0.1.0"
description = "Shared message shapes for the Trusted Trade Agents front door (PurchaseRequest, Mandate, Quote, Decision, AuditEntry)."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest", "jsonschema", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trade_contracts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
